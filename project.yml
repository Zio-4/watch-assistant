name: WatchAssistant
options:
  bundleIdPrefix: com.philipziolkowski
  deploymentTarget:
    watchOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  WatchAssistant:
    type: application
    platform: watchOS
    sources:
      - path: WatchAssistant
    info:
      path: WatchAssistant/App/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philipziolkowski.WatchAssistant
        PRODUCT_NAME: WatchAssistant
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: NO
    scheme:
      gatherCoverageData: true

